<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Một chút dev cho 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--c:#27e8ff;--tx:#dff8ff;--pk:#ff6fae}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#050a1a;color:var(--tx);font:15px/1.5 "JetBrains Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
#stage{position:relative;height:100dvh;min-height:520px;overflow:hidden;transition:background 1s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:absolute;inset:0;width:100%;height:100%}
#play{position:absolute;inset:0}
#top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:5}
#dots{display:flex;gap:6px;margin:0 auto}#dots i{width:7px;height:7px;border-radius:9px;background:#27e8ff44;transition:.4s}#dots i.on{width:26px;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill{border:1px solid #27e8ff55;background:#0a1a2e99;border-radius:12px;padding:5px 10px;font-size:11px}
#eq{display:flex;gap:2px;align-items:flex-end;height:18px}#eq b{width:3px;background:var(--c);animation:eq .8s infinite alternate}#eq b:nth-child(2){animation-delay:.2s}#eq b:nth-child(3){animation-delay:.4s}.mute #eq b{animation:none;height:3px}
@keyframes eq{from{height:3px}to{height:16px}}
#mus{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:6;white-space:nowrap}
#mus.on{border-color:#6dffb0;box-shadow:0 0 10px #6dffb088}
#mus:not(.on){animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 #ffe9a8aa}100%{box-shadow:0 0 0 12px #ffe9a800}}
#mcall{position:absolute;top:calc(50px + env(safe-area-inset-top,0px));left:12px;z-index:6;color:#ffe9a8;font-size:13px;font-weight:700;pointer-events:none;text-shadow:0 0 8px #000;animation:pt .9s ease-in-out infinite alternate}
#mcall b{display:block;font-size:24px;line-height:1;margin-left:22px}
@keyframes pt{to{transform:translateY(-7px)}}
#fx{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:14px;z-index:5}
#pi{position:absolute;left:50%;top:36%;display:flex;gap:20px;transform:translate(-50%,-50%);z-index:3;cursor:pointer;transition:top .5s}
#pi .e{width:46px;height:46px;border-radius:14px;background:#6ff3ff;box-shadow:0 0 28px var(--c);transition:.3s;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#pi.happy .e{height:15px;border-radius:50% 50% 7px 7px;animation:none}
#pi.sad .e{height:15px;border-radius:7px 7px 50% 50%;background:#8fb8ff;animation:none}
#pi.happy{animation:hop 1.2s ease-in-out infinite alternate}
@keyframes hop{to{margin-top:-10px}}
#say{position:absolute;left:0;right:0;top:46%;padding:0 22px;text-align:center;min-height:3.2em;z-index:3;text-shadow:0 0 8px #000;pointer-events:none;transition:top .5s}
.compact #pi{top:19%}.compact #say{top:29%}
#hnt{position:absolute;left:0;right:0;top:63%;padding:0 20px;text-align:center;font-size:13px;color:#ffe9a8;z-index:3;pointer-events:none;text-shadow:0 0 8px #000;animation:nd 1.4s ease-in-out infinite alternate}
@keyframes nd{to{opacity:.5}}
.soil{position:absolute;left:-10%;right:-10%;bottom:0;height:26%;background:radial-gradient(ellipse at 50% 0,#8a5630,#3a2210 70%);border-radius:50% 50% 0 0/30px 30px 0 0;box-shadow:0 -6px 24px #0008;animation:soilup .8s both}
@keyframes soilup{from{transform:translateY(100%)}}
.sp{position:absolute;font-size:30px;line-height:1;transform:translate(-50%,-85%);transition:font-size .7s;pointer-events:none;z-index:2;animation:spr .6s both}
@keyframes spr{from{opacity:0;transform:translate(-50%,-30%) scale(.2)}}
.hl{color:#6dffb0;font-weight:700}.cur{display:inline-block;width:8px;height:15px;background:var(--c);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#cnt{position:absolute;left:0;right:0;top:58%;text-align:center;font-size:12px;opacity:.7;z-index:3;pointer-events:none}
.btn{border:2px solid var(--c);background:#0a1a2e;border-radius:99px;padding:10px 22px;box-shadow:0 0 14px #27e8ff55;font-weight:700;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.btn.pk{border-color:var(--pk);box-shadow:0 0 14px #ff6fae66}
.row{position:absolute;left:0;right:0;top:66%;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;z-index:4}
.col{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:4}
#letter{width:min(88vw,380px);height:150px;resize:none;background:#fff6df;color:#3a2a14;border:0;border-radius:12px;padding:12px 14px;font:600 17px/1.4 "Baloo 2",system-ui,sans-serif;box-shadow:0 0 24px #ffe9a855;user-select:text;-webkit-user-select:text}
.heart,.star,.fl{position:absolute;cursor:pointer;line-height:1}
.heart{font-size:34px;color:#ff6fae;filter:drop-shadow(0 0 8px #ff6fae);animation:fy 4s ease-in-out infinite alternate}
@keyframes fy{to{transform:translate(18px,-26px) rotate(12deg)}}
.star{font-size:46px;color:#ffd25a;filter:drop-shadow(0 0 10px #ffd25a);opacity:.5;transition:.5s;animation:tw 2s ease-in-out infinite alternate}.star.on{opacity:1;transform:scale(1.2)}
@keyframes tw{to{filter:drop-shadow(0 0 20px #fff)}}
.fl{font-size:34px;animation:gr .6s both}@keyframes gr{from{transform:scale(0) rotate(-40deg)}}
.grass{position:absolute;bottom:0;width:3px;background:linear-gradient(#b6ff3c,#23c93b);border-radius:3px 3px 0 0;transform-origin:bottom;animation:sw 3s ease-in-out infinite alternate}
@keyframes sw{to{transform:rotate(6deg)}}
#clv{position:absolute;left:50%;top:70%;width:120px;height:120px;margin:-60px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:conic-gradient(#6dffb0 var(--p,0%),#ffffff22 0);z-index:4}
#clv::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#06301d}#clv span{position:relative;display:inline-block;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.planet{position:absolute;left:-30%;right:-30%;bottom:-70%;height:100%;border-radius:50%;background:radial-gradient(#3b78d8,#1b3a8a);box-shadow:0 0 60px #6a8cff}
#rover{position:absolute;bottom:calc(30% - 4px);left:50%;width:44px;height:26px;background:#ff9a3d;border-radius:5px;transition:left .35s;z-index:3;margin-left:-22px}
#rover::before{content:"";position:absolute;left:12px;top:-12px;width:18px;height:12px;background:#ffc27a;border-radius:4px}
#rover .wh{position:absolute;bottom:-8px;left:5px;width:13px;height:13px;border-radius:50%;background:#222;border:2px solid #aaa;animation:spin .6s linear infinite}
#rover .w2{left:auto;right:5px}
#rover.go{animation:vroom .5s 3}
@keyframes vroom{25%{transform:translateY(-14px) rotate(-6deg)}75%{transform:translateY(0) rotate(5deg)}}
#plane{position:absolute;left:10%;top:80%;font-size:34px;z-index:7;display:none}
#bk{position:absolute;left:50%;top:60%;width:160px;height:215px;margin:-108px 0 0 -80px;perspective:900px;z-index:4}
#bk .book{position:absolute;inset:0;transform-style:preserve-3d;transform:translateX(calc(var(--p,0)*50%))}
#bk .pg{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;background:linear-gradient(90deg,#e9d9b0,#fff6dc);border-radius:3px 10px 10px 3px;transform:translateZ(-1px);box-shadow:0 0 calc(var(--p,0)*50px) #ffe9a0}
#bk .cover{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transform:rotateY(calc(var(--p,0)*-165deg))}
#bk .cf,#bk .cb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 10px 10px 3px}
#bk .cf{display:grid;place-items:center;align-content:center;gap:10px;background:linear-gradient(135deg,#3a2410,#120a03);border:2px solid #c9a24a;box-shadow:0 0 24px #c9a24a66;color:#e8c46a;font-size:64px;line-height:1}
#bk .cf small{font:800 13px "Baloo 2",sans-serif;letter-spacing:.12em}
#bk .cb{transform:rotateY(180deg);background:#7a5528}
#bk.snap .book,#bk.snap .cover{transition:transform .5s}
.hint{position:absolute;left:0;right:0;top:88%;text-align:center;font-size:13px;opacity:.8;z-index:4;animation:nudge 1.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes nudge{to{transform:translateX(14px)}}
.row.v{flex-direction:column;align-items:center}.row .btn{max-width:88vw}
#veil{position:absolute;inset:0;background:#1a0618;opacity:0;pointer-events:none;transition:opacity .6s;z-index:8}
.big{position:absolute;left:0;right:0;top:46%;padding:0 20px;text-align:center;font:800 30px/1.25 "Baloo 2",system-ui,sans-serif;color:#fff;text-shadow:0 0 18px #ff6fae;z-index:4;animation:pop .7s both;pointer-events:none}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-115vh);opacity:0}}
.amb{position:absolute;top:100%;pointer-events:none;z-index:1;animation:rise linear infinite both}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e6f6ffee;color:#06203a;padding:10px 16px;border-radius:16px;font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:.3s;text-align:center;max-width:90vw}#toast.on{opacity:1}
body.nofx canvas,body.nofx .heart,body.nofx .amb{animation:none!important}body.nofx canvas,body.nofx .amb{display:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head><body>
<section id="stage"><canvas id="cv"></canvas>
 <div id="top"><span id="dots"></span><button class="pill" id="snd" aria-label="Âm thanh"><span id="eq"><b></b><b></b><b></b></span></button></div>
 <button class="pill" id="fx">Hiệu ứng: bật</button>
 <button class="pill" id="mus">Bật nhạc 🎶</button>
 <div id="mcall"><b>⬆️</b>bấm vô đây để bật nhạc nhé</div>
 <audio id="bgm" src="nhacnen.mp3" loop preload="auto"></audio>
 <div id="pi"><div class="e"></div><div class="e"></div></div>
 <div id="say"></div><div id="cnt"></div><div id="hnt"></div><div id="play"></div><div id="plane">✈️</div><div id="veil"></div>
</section>
<div id="toast"></div>
<script>
/* ===== CẤU HÌNH: sửa phần này ===== */
const CFG={
 name:'xthanh',
 wishes:['Chúc Cậu thật nhiều *sức khỏe*, ăn ngon ngủ kỹ, không ốm vặt nha','Chúc Cậu luôn bình an và gặp thật nhiều *may mắn* nha','Chúc nụ cười của Cậu luôn *rạng rỡ* như hôm nay nha'],
 order:['intro','hearts','stars','clover','rover','flowers','bible','letter','thanks'], /* đổi thứ tự các cảnh ở đây */
 finale:'Chúc mừng 20/10! Mong mọi điều dịu dàng nhất sẽ đến với Cậu 🌸',
 cloverWish:'Chúc *thế giới của tớ* luôn xinh đẹp, rạng rỡ và có một ngày thật ngọt ngào nhé.',
 roverWish:'Bíp bíp, chúc cậu luôn *thành công* trên con đường đời của mình nhé 🚗💨',
 yes:'Yeahhhhh tớ biết mà 💖 love u',
 wait:'Cậu đang do dự hả? Không sao, tớ luôn chờ mà',
 sad:'Ơ thật hả, tớ sẽ buồn lắm đấy 😔',
 retry:'Ơ hơi, cho tớ chọn lại'
};
/* emoji bay nền cho từng cảnh */
const AMB={intro:['💻','✨','🤖','⌨️'],hearts:['🦋','🎀','🫧','🌈'],stars:['☁️','🪐','🛰️','🫧'],clover:['🦋','🌼','🫧','🐞'],rover:['🚀','🪐','⭐','☄️'],flowers:['🦋','🐝','🍃','🫧'],bible:['✨','🕊️','☁️','👼'],letter:['💌','✉️','🕊️','✨'],thanks:['💖','🌹','✨','💫']};
/* ================================== */
const $=s=>document.querySelector(s),stage=$('#stage'),play=$('#play'),pi=$('#pi'),R=(a,b)=>a+Math.random()*(b-a);
const ORDER=CFG.order;
const TH={intro:['#0b2a3a','#050a1a','39,232,255'],hearts:['#4a1250','#1a0630','255,111,174'],stars:['#3a1a78','#0c0630','255,255,255'],clover:['#0b4a2a','#03180f','109,255,176'],rover:['#3a1a8a','#0c0a3a','160,140,255'],letter:['#10286a','#050a24','80,170,255'],flowers:['#0d3a4a','#04141f','255,214,90'],bible:['#4a3410','#140d02','255,214,120'],thanks:['#4a1250','#1a0630','255,182,217']};
let tok=0,rgb=TH.intro[2],audio=null,mute=false,fx=true;
$('#dots').innerHTML='<i></i>'.repeat(ORDER.length);
function theme(n){const t=TH[ORDER[n]];stage.style.background=`radial-gradient(circle at 50% 40%,${t[0]},${t[1]} 75%)`;rgb=t[2];[...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i===n))}
function beep(f=660,d=.08){if(mute)return;try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),2600)}
function say(s){return new Promise(r=>{const el=$('#say'),k=++tok;el.innerHTML='';const parts=s.split('*'),sp=parts.map((p,i)=>{const x=document.createElement('span');if(i%2)x.className='hl';el.appendChild(x);return x});const cur=document.createElement('i');cur.className='cur';el.appendChild(cur);let a=0,b=0;(function st(){if(k!==tok)return;if(a>=parts.length)return setTimeout(r,1200+s.length*30);if(b<parts[a].length){const ch=[...parts[a].slice(b)][0];sp[a].textContent+=ch;b+=ch.length;setTimeout(st,45)}else{a++;b=0;st()}})()})}
const count=(l,n,m)=>$('#cnt').textContent=l?`${l}: ${n}/${m}`:'';
const hint=t=>$('#hnt').textContent=t||'';
function burst(x,y,ch=['🌸','✦','✨','💗']){if(!fx)return;for(let i=0;i<10;i++){const p=document.createElement('span');p.textContent=ch[i%ch.length];p.style.cssText=`position:fixed;left:${x}px;top:${y}px;z-index:50;pointer-events:none`;document.body.appendChild(p);const a=R(0,6.28),d=R(40,110);p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:900}).onfinish=()=>p.remove()}}
const bAt=(e,ch)=>{const r=e.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch)};
const el=(c,h,p=play)=>{const e=document.createElement('div');e.className=c;e.innerHTML=h||'';p.appendChild(e);return e};
const btn=(t,c='btn')=>{const b=document.createElement('button');b.className=c;b.textContent=t;return b};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ENDPOINT='https://formspree.io/f/abcdwxyz'; https://formspree.io/f/xoejbave
const report=(k,v)=>{try{const f=new FormData();f.append(k,v);f.append('lúc',new Date().toLocaleString('vi-VN'));fetch(ENDPOINT,{method:'POST',body:f,headers:{Accept:'application/json'}}).catch(()=>{})}catch(e){}};
function ambient(list){if(!list)return;for(let i=0;i<14;i++){const a=el('amb',list[i%list.length]);a.style.cssText=`left:${R(2,94)}%;font-size:${R(16,34)}px;animation-duration:${R(8,16)}s;animation-delay:${-R(0,14)}s;opacity:.7`}}
/* nền bokeh */
const cv=$('#cv'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=stage.clientWidth;cv.height=stage.clientHeight;P=Array.from({length:45},()=>({x:R(0,cv.width),y:R(0,cv.height),r:R(2,9),v:R(.1,.5),a:R(.15,.5)}))}
addEventListener('resize',rs);rs();
(function loop(){if(fx){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y-=p.v;if(p.y<-10){p.y=cv.height+10;p.x=R(0,cv.width)}const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2);g.addColorStop(0,`rgba(${rgb},${p.a})`);g.addColorStop(1,`rgba(${rgb},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*2,0,6.28);cx.fill()})}requestAnimationFrame(loop)})();
stage.addEventListener('pointermove',e=>{const r=pi.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/stage.clientWidth*14,dy=(e.clientY-r.top)/stage.clientHeight*10;pi.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const ro=$('#rover');if(ro)ro.style.left=e.clientX+'px'});
/* nhạc nền: đặt file nhacnen.mp3 cùng thư mục với index.html */
const bgm=$('#bgm'),mus=$('#mus');bgm.volume=.6;
mus.onclick=async()=>{$('#mcall').style.display='none';
 if(bgm.paused){try{await bgm.play();mus.textContent='Tắt nhạc 🎶';mus.classList.add('on')}catch(e){toast('Không phát được nhạc, kiểm tra file nhacnen.mp3 nhé 🎵')}}
 else{bgm.pause();mus.textContent='Bật nhạc 🎶';mus.classList.remove('on')}};
$('#snd').onclick=e=>{mute=!mute;e.currentTarget.classList.toggle('mute',mute)};
$('#fx').onclick=e=>{fx=!fx;document.body.classList.toggle('nofx',!fx);e.currentTarget.textContent='Hiệu ứng: '+(fx?'bật':'tắt')};
/* các cảnh */
const SC={
intro:async()=>{await say('Ơ... có ai ở đó không vậy? 👀');await say('Tớ là *Pi*, bé robot nhỏ xíu sống trong trang web này nè 🤖');$('#cnt').textContent='(chạm vào mắt tớ)';await new Promise(r=>pi.onclick=()=>{bAt(pi,['✨','💻','🤖','⚡']);beep(880);pi.onclick=null;r()});count();await say('Cậu thử đưa chuột đến mắt tớ xem, tớ không giận đâu 😆');await say('Mà tớ...');await say(`Người đó là *${CFG.name}* nè, dặn tớ phải mang thông điệp đến cậu 💌`)},
hearts:async()=>{pi.classList.add('happy');await say('Tớ nhìn mà tim cũng đập thình thịch nè 💓');await say('Cậu giúp tớ bắt mấy trái *tim* đang trốn nha 💗');let n=0;count('trái tim',0,5);hint('👆 Chạm vào trái tim để bắt chúng lại');await new Promise(r=>{for(let i=0;i<5;i++){const h=el('heart','♥');h.style.cssText=`left:${R(8,82)}%;top:${R(14,80)}%;animation-delay:${-R(0,4)}s`;h.onpointerdown=e=>{e.stopPropagation();burst(e.clientX,e.clientY,['💗','✦','💕']);beep(700+n*90);h.remove();count('trái tim',++n,5);if(n==5)r()}}});hint();await say('Giỏi quá! Cậu bắt hết rồi, tim tớ ấm hẳn lên 🥰');pi.classList.remove('happy')},
stars:async()=>{await say('Cậu chạm vào từng ngôi sao để mở nhé 🌟');let n=0;const ss=[];count('điều ước',0,3);hint('👆 Chạm vào từng ngôi sao để mở điều ước');await new Promise(r=>{[[12,14],[44,9],[76,16]].forEach(([x,y],i)=>{const s=el('star','★');s.style.cssText=`left:${x}%;top:${y}%`;ss.push(s);s.onpointerdown=async e=>{e.stopPropagation();if(s.classList.contains('on'))return;s.classList.add('on');burst(e.clientX,e.clientY,['⭐','✨','🌠']);beep(600+i*200);count('điều ước',++n,3);const w=say(CFG.wishes[i]+' '+['💪','🍀','😊'][i]);if(n==3){await w;r()}}})});hint();const sv=document.createElementNS('http://www.w3.org/2000/svg','svg');sv.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';sv.innerHTML=`<polyline fill="none" stroke="#ffd25a99" points="${ss.map(s=>`${s.offsetLeft+23},${s.offsetTop+23}`).join(' ')}"/>`;play.prepend(sv);await say('Ba điều ước bay lên trời hết rồi, tớ nghe thấy tiếng sao reo! 🌠')},
clover:async()=>{await say('Một chiếc *cỏ 4 lá* tớ giữ cho cậu nè 🍀');await say('Cậu giữ chặt nó một chút để nhận quà nha 🎁');const c=el('','<span>🍀</span>');c.id='clv';$('#cnt').textContent='giữ chặt (hoặc chạm liên tục)';await new Promise(r=>{let p=0,t;const up=v=>{p=Math.min(100,p+v);c.style.setProperty('--p',p+'%');if(p>=100){clearInterval(t);r()}};c.onpointerdown=e=>{e.stopPropagation();up(6);beep(400+p*6,.05);clearInterval(t);t=setInterval(()=>up(2.2),60)};c.onpointerup=c.onpointerleave=()=>clearInterval(t)});count();bAt($('#clv'),['🍀','✨','🌿','💚']);const cl=$('#clv');cl.style.transition='top .6s';cl.style.top='80%';await say('Nè, cầm lấy đi! 🎀');await say(CFG.cloverWish+' 🌷');await wait(1800)},
rover:async()=>{el('planet');const ro=el('','<i class="wh"></i><i class="wh w2"></i>');ro.id='rover';await say('Bíp! 🚗');$('#cnt').textContent='kéo xe theo ngón tay, rồi chạm vào xe nhé 🚙';
 await new Promise(r=>{play.onpointerdown=e=>{const b=ro.getBoundingClientRect();if(Math.abs(e.clientX-(b.left+b.width/2))<70&&Math.abs(e.clientY-(b.top+b.height/2))<70){play.onpointerdown=null;r()}}});
 count();beep(300,.15);beep(450,.2);bAt(ro,['💨','🚀','⭐','✨']);ro.classList.add('go');
 await say(CFG.roverWish);await wait(900);
 const b=btn('Đi thôi nào! 🚀');const r=el('row');r.style.top='54%';r.append(b);await new Promise(x=>b.onclick=x);await say('Đi thôi! Còn một việc cuối cùng nữa thôi 💫')},
letter:async()=>{await say('Nè *Cậu*... 💌');await say(`Cậu viết giúp tớ một lá thư gửi *${CFG.name}* được không? ✉️`);const row=el('row'),y=btn('Được chứ! 💖'),n=btn('Để tớ nghĩ đã...','btn pk');row.append(y,n);let k=0;await new Promise(r=>{y.onclick=r;n.onclick=()=>{if(++k>=2)return r();n.textContent='ừm, thôi được...';n.style.transform=`translate(${R(-60,60)}px,${R(-10,50)}px)`}});row.remove();
 stage.classList.add('compact');await say(`Cậu viết vài dòng gửi *${CFG.name}* nhé, xong thì thả máy bay giấy đi nha ✈️`);
 const c=el('col');c.style.top='38%';const t=document.createElement('textarea');t.id='letter';t.maxLength=1500;t.placeholder='Viết lá thư của cậu ở đây...';const b=btn('✈️ Thả máy bay giấy','btn pk');c.append(t,b);
 await new Promise(r=>{b.onclick=async()=>{const m=t.value.trim();if(!m){toast('Cậu viết vài dòng vào lá thư trước nhé 💌');t.focus();return}
  const text=`Gửi ${CFG.name},\n\n${m}\n\n— thư gửi qua máy bay giấy của report('lá thư',m);
 report('lá thư',m);
  const pl=$('#plane');pl.style.display='block';pl.animate([{transform:'translate(0,0)'},{transform:`translate(${stage.clientWidth}px,-${stage.clientHeight*.6}px) rotate(-20deg)`}],{duration:1600}).onfinish=()=>pl.style.display='none';beep(900);
  try{if(navigator.share)await navigator.share({title:`Thư gửi ${CFG.name}`,text});else{await navigator.clipboard.writeText(text);toast(`Đã sao chép lá thư, dán vào tin nhắn gửi ${CFG.name} nhé`)}}
  catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(text);toast('Đã sao chép lá thư, dán vào tin nhắn nhé')}catch(_){}}
  await wait(1200);r()}});
 c.remove();stage.classList.remove('compact')},
flowers:async()=>{el('soil');
 await say('Cùng tớ trồng một *khu vườn* nhé 🌱');
 const H=stage.clientHeight,soilTop=H*.74,sp=[];let n=0;
 hint('👆 Chạm vào đất để gieo mầm');count('hạt mầm',0,3);
 await new Promise(r=>{play.onpointerdown=e=>{if(e.clientY<soilTop){toast('Chạm xuống phần đất nhé 🟫');return}
  const s=el('sp','🌱');s.style.cssText=`left:${e.clientX}px;top:${Math.min(e.clientY,H-24)}px`;sp.push(s);burst(e.clientX,e.clientY,['🌱','✨','🟤']);beep(480+n*120);count('hạt mầm',++n,3);if(n==3){play.onpointerdown=null;r()}}});
 count();hint();
 await say('Mầm nhỏ khát nước rồi, mình tưới cho chúng nhé 💧');
 const water=async(s,k)=>{const b=s.getBoundingClientRect(),cx=b.left+b.width/2,top=b.top-70;
  const can=document.createElement('span');can.textContent='🪣';can.style.cssText=`position:fixed;left:${cx-5}px;top:${top-34}px;font-size:40px;z-index:50;pointer-events:none;opacity:0`;document.body.appendChild(can);
  can.animate([{transform:'rotate(0)',opacity:0},{transform:'rotate(-40deg)',opacity:1,offset:.2},{transform:'rotate(-40deg)',opacity:1,offset:.85},{transform:'rotate(0)',opacity:0}],{duration:2000}).onfinish=()=>can.remove();
  await wait(500);
  for(let i=0;i<9;i++){const d=document.createElement('span');d.textContent='💧';d.style.cssText=`position:fixed;left:${cx-22+R(-12,12)}px;top:${top}px;z-index:49;pointer-events:none;opacity:0`;document.body.appendChild(d);d.animate([{transform:'translateY(0)',opacity:1},{transform:`translateY(${b.top-top+10}px)`,opacity:0}],{duration:650,delay:i*110,fill:'both'}).onfinish=()=>d.remove();beep(900-i*40,.04)}
  await wait(1400);s.style.fontSize=(42+k*10)+'px';bAt(s,['💧','✨','🌿']);await wait(800)};
 hint('👆 Chạm để tưới nước cho từng mầm cây');
 for(let i=0;i<3;i++){count('lần tưới',i,3);await new Promise(r=>play.onpointerdown=()=>{play.onpointerdown=null;r()});count('lần tưới',i+1,3);await water(sp[i],i)}
 count();hint();
 await say('Mầm đã lớn lên rồi... sắp nở hoa 🌿');
 sp.forEach(s=>{s.textContent='🌸';s.style.fontSize='64px';bAt(s,['🌸','✨','💮'])});beep(1000,.3);await wait(900);
 stage.classList.add('compact');
 for(let i=0;i<46;i++){const g=el('grass');g.style.cssText=`left:${i*2.2}%;height:${R(60,150)}px;animation-delay:${-R(0,3)}s`}
 stage.style.background='radial-gradient(circle at 50% 70%,#6b2a6a,#1a0630 75%)';rgb='255,182,217';
 const E=['🌸','🌷','🌼','🌺','🌻','🌹','💮'];for(let i=0;i<80;i++){const f=el('fl',E[i%E.length]),y=R(52,95),s=.6+y/95*.9;f.style.cssText=`left:${R(-2,96)}%;top:${y}%;font-size:${30*s}px;pointer-events:none;animation:gr .9s ${R(0,3)}s both`}beep(1000,.3);
 await say('Cả khu rừng hoa đang nở này! 🌺');await say(CFG.finale);await wait(2600)},
bible:async()=>{stage.classList.add('compact');const op=openBook();await Promise.race([say('Có một cuốn sách kỳ lạ nè... Cậu vuốt sang phải để mở nhé 📖'),op]);await op;pi.classList.add('happy');burst(innerWidth/2,innerHeight*.6,['👼','✨','✦','🕊️']);
 await say('Cậu có biết thiên thần nhìn như nào không? 😇');await say('Chính là cậu á 🫵');burst(innerWidth/2,innerHeight*.45,['💗','✨','👼']);await wait(2200)},
thanks:async()=>{const T=[['#4a1250','#1a0630','255,182,217'],['#5a1a3a','#200614','255,140,170'],['#7a1f4a','#2a0618','255,111,174']],veil=$('#veil');
 const tint=t=>{stage.style.background=`radial-gradient(circle at 50% 40%,${t[0]},${t[1]} 75%)`;rgb=t[2]};
 const fade=async fn=>{veil.style.opacity=1;await wait(650);$('#say').innerHTML='';fn();veil.style.opacity=0;await wait(500)};
 pi.classList.add('happy');
 await say('Tớ *cảm ơn* cậu vì đã xuất hiện trong cuộc đời tớ 🌹');await wait(1300);
 await fade(()=>tint(T[1]));await say('Cảm ơn cậu đã khiến tớ cười, tớ *hạnh phúc* 😊');await wait(1300);
 await fade(()=>tint(T[2]));
 const ask=async()=>{await say('Tớ mong là tớ với cậu sẽ trở thành *một đôi* 💞');await wait(900);
  if(await choose('Đương nhiên là có rồi 💖','...')===0)return true;
  await say(CFG.wait+' 🥺');
  if(await choose('Ko ý, tớ là tớ đang bật đèn xanh rồi á 💚','Ukm')===0)return true;
  pi.classList.remove('happy');pi.classList.add('sad');tint(['#1a2a5a','#060a1e','120,160,255']);
  await say(CFG.sad);await choose(CFG.retry);
  pi.classList.remove('sad');pi.classList.add('happy');tint(T[2]);burst(innerWidth/2,innerHeight*.4,['💧','🥺','💗']);
  return false};
 while(!(await ask()));
 return ending()}
};
const S=ORDER.map(k=>SC[k]);
const choose=(a,b)=>new Promise(r=>{const row=el('row v'),x=btn(a,'btn pk');row.append(x);x.onclick=()=>{report('đã chọn',a);row.remove();r(0)};if(b){const y=btn(b);row.append(y);y.onclick=()=>{report('đã chọn',b);row.remove();r(1)}}});
function openBook(){return new Promise(r=>{const w=el('','<div class="book"><div class="pg">😇</div><div class="cover"><div class="cf">✝<small>KINH THÁNH</small></div><div class="cb"></div></div></div>');w.id='bk';const h=el('hint','vuốt sang phải để mở ➜');let x0=null,p=0;const set=v=>{p=v;w.style.setProperty('--p',v)};play.style.touchAction='none';
 play.onpointerdown=e=>{x0=e.clientX;w.classList.remove('snap')};
 play.onpointermove=e=>{if(x0!=null)set(Math.max(0,Math.min(1,(e.clientX-x0)/130)))};
 play.onpointerup=play.onpointercancel=()=>{if(x0==null)return;x0=null;w.classList.add('snap');if(p>.5){set(1);h.remove();beep(880);play.onpointerdown=play.onpointermove=play.onpointerup=play.onpointercancel=null;setTimeout(r,700)}else set(0)}})}
async function ending(){play.innerHTML='';$('#say').innerHTML='';count();pi.classList.remove('sad');pi.classList.add('happy');stage.style.background='radial-gradient(circle at 50% 40%,#8a1f58,#2a0620 75%)';rgb='255,111,174';
 for(let i=0;i<30;i++){const h=el('heart','♥');h.style.cssText=`left:${R(0,95)}%;top:100%;font-size:${R(18,44)}px;pointer-events:none;animation:rise ${R(3,6)}s ${R(0,3)}s linear infinite both`}
 ambient(['💖','🎉','✨','🌸','💕']);
 el('big',CFG.yes);beep(1000,.3);bAt(pi,['💖','🎉','✨','🌸']);await wait(3800)}
async function go(n){tok++;play.innerHTML='';play.onpointerdown=play.onpointermove=play.onpointerup=play.onpointercancel=null;play.style.touchAction='';pi.onclick=null;pi.classList.remove('happy','sad');stage.classList.remove('compact');count();hint();theme(n);ambient(AMB[ORDER[n]]);try{await S[n]();if(n<S.length-1)go(n+1);else replay()}catch(e){console.error(e)}}
function replay(){const row=el('row'),b=btn('Xem lại từ đầu 🔄');row.style.top='80%';row.append(b);b.onclick=()=>go(0)}
go(0);
</script></body></html>
